<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Portal Login — NSN SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="bg-gray-900 border border-gray-800 w-full max-w-md p-8 rounded-3xl shadow-2xl">
    
    <!-- Logo & Header -->
    <div class="text-center mb-6">
      <div class="bg-amber-500/10 text-amber-400 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-amber-500/20">
        <i class="fa-solid fa-shield-halved text-3xl"></i>
      </div>
      <h2 class="text-2xl font-black text-white">NSN Master SaaS</h2>
      <p class="text-xs text-gray-400 mt-1">Super Admin Authentication Portal</p>
    </div>

    <!-- Login Form -->
    <form onsubmit="handleMasterLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">Master Username</label>
        <div class="relative">
          <input type="text" id="master-username" placeholder="Username" required class="w-full pl-10 pr-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-sm focus:outline-none focus:border-amber-500 text-white">
          <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-gray-500 text-sm"></i>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">Master Password</label>
        <div class="relative">
          <input type="password" id="master-password" placeholder="Password" required class="w-full pl-10 pr-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-sm focus:outline-none focus:border-amber-500 text-white">
          <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-gray-500 text-sm"></i>
        </div>
      </div>

      <button type="submit" id="login-btn" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-extrabold py-3 rounded-xl text-sm transition shadow-lg flex items-center justify-center space-x-2">
        <span>Sign In to Master Portal</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div id="login-error" class="hidden mt-4 p-3 bg-red-500/10 border border-red-500/20 text-red-400 text-xs text-center rounded-xl font-bold"></div>
  </div>

  <script>
    // Master Credentials
    const MASTER_USER = "master";
    const MASTER_PASS = "master@123";

    // Auto redirect if already authenticated
    if (sessionStorage.getItem('nsn_master_auth') === 'true') {
      window.location.href = 'master.html';
    }

    function handleMasterLogin(e) {
      e.preventDefault();
      const user = document.getElementById('master-username').value.trim();
      const pass = document.getElementById('master-password').value.trim();
      const errorDiv = document.getElementById('login-error');

      if (user === MASTER_USER && pass === MASTER_PASS) {
        // Save session flag
        sessionStorage.setItem('nsn_master_auth', 'true');
        
        // Show success state
        document.getElementById('login-btn').innerText = "Authenticated! Redirecting...";
        
        // REDIRECT TO MASTER WEBSITE
        setTimeout(() => {
          window.location.href = 'master.html';
        }, 500);
      } else {
        errorDiv.classList.remove('hidden');
        errorDiv.innerText = "Invalid credentials! Master username is 'master' and password is 'master@123'";
      }
    }
  </script>
</body>
</html>
